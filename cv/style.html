<style>
  /* Standalone CV — borrows token VALUES from DESIGN.md (amber scale, Geist, mono-label
     pattern), inverted to light paper for ATS/print. Does not consume global.css. */
  @font-face {
    font-family: 'Geist Variable';
    font-style: normal;
    font-weight: 100 900;
    src: url(./fonts/geist-latin-wght-normal.woff2) format('woff2-variations');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Geist Variable';
    font-style: normal;
    font-weight: 100 900;
    src: url(./fonts/geist-latin-ext-wght-normal.woff2) format('woff2-variations');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Geist Mono Variable';
    font-style: normal;
    font-weight: 100 900;
    src: url(./fonts/geist-mono-latin-wght-normal.woff2) format('woff2-variations');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Geist Mono Variable';
    font-style: normal;
    font-weight: 100 900;
    src: url(./fonts/geist-mono-latin-ext-wght-normal.woff2) format('woff2-variations');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --ink: #18181b;          /* headings */
    --body: #3f3f46;         /* body text */
    --muted: #71717a;        /* meta, stack tails */
    --hairline: #e4e4e7;
    --amber: #f59e0b;        /* thick rules only (DESIGN.md --color-accent) */
    --amber-text: #b45309;   /* small text on white, AA 5.0:1 (amber-700; #d97706 is only 3.19:1) */
    --sans: 'Geist Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono Variable', 'JetBrains Mono', ui-monospace, monospace;
  }

  @page { size: A4; margin: 8mm 13mm 8mm; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: var(--sans);
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--body);
    background: #fff;
    max-width: 720px;
    margin: 0 auto;
  }
  @media screen { body { padding: 48px 24px; } }

  a { color: var(--amber-text); text-decoration: none; }
  :focus-visible { outline: 2px solid var(--amber-text); outline-offset: 2px; }

  /* ---- header ---- */
  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--ink);
  }
  h1 .dot { color: #d97706; } /* 24px bold = WCAG large text, 3:1 threshold */
  .headline {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--amber-text);
    margin-top: 4px;
  }
  .contact {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--muted);
    font-variant-ligatures: none;
  }
  .contact .sep { color: #a1a1aa; padding: 0 2px; }

  /* ---- sections ---- */
  section { margin-top: 9px; }
  h2 {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink);
    border-bottom: 2px solid var(--amber);
    padding-bottom: 3px;
    margin-bottom: 7px;
    break-after: avoid;
  }

  .summary { max-width: 100%; }

  /* ---- experience entries ---- */
  .role { break-inside: avoid; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  .row .dates {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  h3 { font-size: inherit; font-weight: inherit; }
  .role-title { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .role-desc { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

  .project { margin-top: 7px; padding-left: 12px; border-left: 2px solid var(--hairline); break-inside: avoid; }
  .project-title { font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .project-title .hook { font-weight: 400; color: var(--body); }

  ul { list-style: none; margin-top: 2px; }
  li { padding-left: 11px; position: relative; margin-top: 1px; text-wrap: pretty; }
  li::before { content: '•'; position: absolute; left: 0; color: var(--amber-text); }

  .stack {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.01em;
  }

  /* earlier experience: compact rows */
  .early { margin-top: 4px; break-inside: avoid; }
  .early .what { font-size: 11px; }
  .early .what strong { color: var(--ink); font-weight: 600; }

  /* skills */
  .skill-row { margin-top: 2px; break-inside: avoid; }
  .skill-row .cat {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink);
  }

  /* education */
  .edu { margin-top: 3px; break-inside: avoid; }
  .edu .what strong { color: var(--ink); font-weight: 600; }
</style>
