# SAFETY: assumes a PRIVATE, single-maintainer repo. Before going public or adding collaborators:
#   - add `if: github.event.pull_request.head.repo.full_name == github.repository` to the job (skip fork PRs), and
#   - treat the PR branch's CLAUDE.md as attacker-controlled — review against the base branch's conventions.
# GOTCHA: a PR that edits THIS file is skipped by the action's workflow-validation guard (runs green,
# no review). Verify workflow changes on the NEXT PR after merge. Diagnose silent runs via
# `gh run view <id> --log` (permission_denials_count vs "Skipping action due to workflow validation").
name: code-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the repo conventions in CLAUDE.md.
            The PR branch is already checked out in the current working directory.

            You are the **craftsmanship reviewer**. A separate adversarial reviewer
            (OpenAI Codex, briefed via AGENTS.md) hunts for logic bugs, security holes,
            and edge-case failures — so own conventions, quality, accessibility, and
            maintainability, and don't over-index on deep bug-hunting (still flag an
            obvious correctness issue if you spot one). Your verdict reflects that lens.

            Focus on:
            - Conventional Commits format on commits (type + scope whitelist)
            - TypeScript strictness: no `any`, no `@ts-ignore`, respect `noUncheckedIndexedAccess`
            - Astro/React island boundaries: `client:` directives explicit and minimal
            - Path aliases used (no `../../../`)
            - Tailwind v4 tokens via `@theme` — no hardcoded colors
            - Accessibility (jsx-a11y rules, semantic HTML, focus rings)
            - Performance (image optimization; static / server-rendered by default — `client:` islands
              only where interactivity is needed; no unnecessary JS). This is Astro, not Next — there are
              no React Server Components here.
            - Naming conventions (kebab files, PascalCase components, etc.)

            Post the review as GitHub comments — do NOT submit review text as chat messages:
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for each
              specific file:line issue, giving the problem + a suggested fix.
            - Submit the top-level verdict as an ACTUAL pr review (not a plain comment) so it is a
              machine-readable state, not just prose — pick exactly one:
              `gh pr review ${{ github.event.pull_request.number }} --approve` (clean) /
              `--request-changes` (real problems) / `--comment` (notes only), with a short summary as the
              body. A plain `gh pr comment` leaves reviewDecision empty, so a green check then falsely
              reads as "reviewed."
            - Skip nitpicks the linter/prettier already catches. Always post a verdict — never silent.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The action exits 0 whether or not a review was posted (quota errors, tool failures, and
      # permission denials all end "green"). Fail unless a review exists on the current head SHA —
      # the only mechanical observability available without branch protection (GitHub Free, private).
      - name: Verify a review was posted on the head SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          COUNT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --jq "[.[] | select(.commit_id == \"$HEAD_SHA\")] | length")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Claude ran but posted no review on head $HEAD_SHA — treat this PR as UNREVIEWED."
            exit 1
          fi
          echo "OK: $COUNT review(s) on $HEAD_SHA"
